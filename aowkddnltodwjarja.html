<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6eb7">
<title>MOMOS 위생 점검</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --brand:#1f6eb7; --brand-ink:#174f85; --brand-soft:#e8f1fb; --brand-line:#c7dcf2;
  --ink:#1b1f24; --muted:#6b7280; --faint:#9aa3af; --line:#e5e7eb; --bg:#ffffff; --panel:#f6f8fb;
  --ok:#1f8a4c; --ok-soft:#e6f4ec; --warn:#b5720a; --warn-soft:#fff4dc; --bad:#c62828; --bad-soft:#fdecec; --na:#6b7280; --na-soft:#eef0f3;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:640px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
header.top .brand{font-size:12px;letter-spacing:.12em;opacity:.85;font-weight:600}
header.top h1{margin:2px 0 0;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
header.top .subtitle{font-size:13px;opacity:.9;margin-top:2px}
main{flex:1;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.screen{display:none}.screen.on{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
h2{font-size:17px;margin:0 0 6px}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:12px 0 6px}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{min-height:70px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:13px 16px;font-weight:700;width:100%;transition:.12s}
.btn.primary{background:var(--brand);color:#fff}.btn.primary:active{background:var(--brand-ink)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px}.row>*{flex:1}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--panel);padding:4px;border-radius:12px}
.team{padding:11px;border-radius:10px;font-weight:700;color:var(--muted);text-align:center}
.team.on{background:#fff;color:var(--brand);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);background:#fff}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.menu{display:grid;gap:10px}
.menu .item{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.menu .item:active{background:var(--brand-soft)}
.menu .ico{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:15px}
.menu .t{font-weight:700;font-size:16px}.menu .desc{color:var(--muted);font-size:13px}
.menu .arr{margin-left:auto;color:var(--faint)}
.progress{position:sticky;top:calc(72px + env(safe-area-inset-top));z-index:5;background:#fff;padding:10px 0 8px;margin:-6px 0 6px;border-bottom:1px solid var(--line)}
.bar{height:8px;border-radius:999px;background:var(--panel);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
.pbtxt{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.sec{margin:18px 0 8px;font-size:13px;font-weight:800;color:var(--brand);letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--brand-line)}
.it{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.it.need{border-color:var(--warn)}
.it .head{display:flex;gap:8px;align-items:flex-start}
.it .id{font-size:12px;color:var(--faint);font-weight:700;min-width:38px;padding-top:2px}
.it .txt{flex:1;font-weight:600}
.it .base{font-size:12px;color:var(--muted);margin-top:2px;font-weight:400}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;vertical-align:middle;margin-left:6px}
.tag.law{background:var(--bad-soft);color:var(--bad)}.tag.int{background:var(--na-soft);color:var(--na)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.seg button{padding:10px 4px;border-radius:10px;border:1px solid var(--line);font-weight:700;font-size:13px;background:#fff;color:var(--muted);line-height:1.2}
.seg button small{display:block;font-size:11px;font-weight:600;opacity:.8}
.seg button.on[data-v="O"]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on[data-v="△"]{background:var(--warn);border-color:var(--warn);color:#fff}
.seg button.on[data-v="X"]{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button.on[data-v="N/A"]{background:var(--na);border-color:var(--na);color:#fff}
.why{margin-top:10px;display:none}.why.on{display:block}
.why textarea{min-height:56px}
.why .lbl{font-size:12px;font-weight:700;color:var(--warn);margin-bottom:4px}
.foot{margin-top:18px;display:grid;gap:10px}
.msg{margin:10px 0;padding:12px;border-radius:10px;font-size:14px;display:none}
.msg.on{display:block}.msg.err{background:var(--bad-soft);color:var(--bad)}.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.info{background:var(--brand-soft);color:var(--brand-ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stat{border-radius:12px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800}.stat span{font-size:12px;font-weight:600}
.stat.O{background:var(--ok-soft);color:var(--ok)}.stat.T{background:var(--warn-soft);color:var(--warn)}.stat.X{background:var(--bad-soft);color:var(--bad)}.stat.N{background:var(--na-soft);color:var(--na)}
.score{text-align:center;padding:10px 0 4px}
.score b{font-size:48px;font-weight:800;color:var(--brand);line-height:1}
.score span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.list{display:grid;gap:8px}
.sub{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.sub:active{background:var(--brand-soft)}
.sub .dt{font-weight:700}.sub .meta{color:var(--muted);font-size:12px}
.sub .sc{margin-left:auto;text-align:right}
.sub .sc b{font-size:20px;font-weight:800;color:var(--brand)}
.badges{display:flex;gap:4px;font-size:11px;font-weight:700;margin-top:3px;justify-content:flex-end}
.b{padding:1px 6px;border-radius:6px}
.b.O{background:var(--ok-soft);color:var(--ok)}.b.T{background:var(--warn-soft);color:var(--warn)}.b.X{background:var(--bad-soft);color:var(--bad)}.b.N{background:var(--na-soft);color:var(--na)}
.chart{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:150px;padding:8px 4px 0;border-bottom:1px solid var(--line)}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--muted)}
.col .v{font-weight:800;color:var(--brand);font-size:12px}
.col .bx{width:100%;max-width:38px;background:var(--brand);border-radius:6px 6px 0 0;min-height:2px;opacity:.9}
.col .bx.empty{background:var(--line)}
.col .x{font-size:10px;color:var(--bad);font-weight:700;height:12px}
.xlab{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
.dl{display:grid;gap:6px;margin-top:10px}
.d{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.d .r{min-width:52px;text-align:center;font-weight:800;font-size:12px;padding:4px 0;border-radius:8px}
.d .r.O{background:var(--ok-soft);color:var(--ok)}.d .r.T{background:var(--warn-soft);color:var(--warn)}.d .r.X{background:var(--bad-soft);color:var(--bad)}.d .r.N{background:var(--na-soft);color:var(--na)}
.d .n{font-size:14px}.d .n small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.d .n .why2{display:block;margin-top:4px;font-size:13px;color:var(--warn);font-weight:600}
.top5 .d .n{flex:1}.top5 .cnt{font-size:12px;color:var(--muted);white-space:nowrap}
.setup{padding:14px;border:1px dashed var(--warn);border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13px;margin-bottom:12px;word-break:break-all}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.dim{color:var(--muted)}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border:0}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">MOMOS COFFEE · 위생 점검</div>
    <h1 id="h-title">매장 선택</h1>
    <div class="subtitle" id="h-sub">바리스타팀 · 베이커리팀 일일 / 주간 / 월간 위생 체크리스트</div>
  </header>
  <main>
    <div id="setup" class="setup" style="display:none"></div>
    <div id="msg" class="msg"></div>

    <!-- 로그인 -->
    <section class="screen on" id="s-login">
      <div class="card">
        <h2>팀과 매장을 선택해 주세요</h2>
        <p class="hint">매장 코드는 앱 관리자(매장사업부)에게 받은 4자리 숫자입니다.</p>
        <div class="teams" id="teams"></div>
        <label class="f">매장</label>
        <select id="store"></select>
        <label class="f">매장 코드</label>
        <input type="password" id="code" inputmode="numeric" placeholder="예) 1003" autocomplete="off">
        <label class="f">담당자 이름</label>
        <input type="text" id="name" placeholder="점검하는 사람 이름" autocomplete="off">
        <div class="foot"><button class="btn primary" id="btn-login">시작하기</button></div>
      </div>
    </section>

    <!-- 홈 -->
    <section class="screen" id="s-home">
      <div class="menu" id="menu"></div>
      <div class="foot">
        <button class="btn soft" id="btn-report">점검 결과 보기</button>
        <button class="btn ghost" id="btn-logout">매장 / 팀 변경</button>
      </div>
    </section>

    <!-- 점검 -->
    <section class="screen" id="s-check">
      <div class="progress">
        <div class="pbtxt"><span id="p-title">점검</span><span><b id="p-done">0</b> / <span id="p-total">0</span></span></div>
        <div class="bar"><i id="p-bar"></i></div>
      </div>
      <div class="card" style="margin-bottom:12px">
        <div class="row">
          <div><label class="f" style="margin-top:0">점검일</label><input type="date" id="date"></div>
          <div><label class="f" style="margin-top:0">담당자</label><input type="text" id="name2"></div>
        </div>
      </div>
      <div id="items"><p class="hint">점검 항목을 불러오는 중…</p></div>
      <div class="card">
        <label class="f" style="margin-top:0">전체 특이사항 (선택)</label>
        <textarea id="note" placeholder="오늘 점검에서 공유할 내용이 있으면 적어 주세요"></textarea>
      </div>
      <div class="foot">
        <button class="btn primary" id="btn-submit">제출하기</button>
        <button class="btn ghost" id="btn-back1">뒤로</button>
      </div>
    </section>

    <!-- 완료 -->
    <section class="screen" id="s-done">
      <div class="card">
        <h2 style="text-align:center">점검이 기록되었습니다</h2>
        <p class="hint" style="text-align:center" id="done-meta"></p>
        <div class="score"><b id="done-score">-</b><span>점수 (O=2 · △=1 · X=0)</span></div>
        <div class="stats">
          <div class="stat O"><b id="d-O">0</b><span>이행</span></div>
          <div class="stat T"><b id="d-T">0</b><span>일부미흡</span></div>
          <div class="stat X"><b id="d-X">0</b><span>미이행</span></div>
          <div class="stat N"><b id="d-N">0</b><span>해당없음</span></div>
        </div>
        <div class="foot">
          <button class="btn soft" id="btn-done-detail">방금 제출한 내용 보기</button>
          <button class="btn ghost" id="btn-done-home">처음으로</button>
        </div>
      </div>
    </section>

    <!-- 대시보드 -->
    <section class="screen" id="s-report">
      <div class="chips" id="cycle-chips"></div>
      <div class="card">
        <h2>월별 점수 추이</h2>
        <p class="hint" id="trend-hint">최근 6개월 · 제출 평균 점수 (막대 아래 숫자는 미이행 건수)</p>
        <div class="chart" id="chart"></div>
        <div class="xlab" id="xlab"></div>
      </div>
      <div class="card top5" id="top5-card" style="display:none">
        <h2>최근 90일 자주 미흡한 항목</h2>
        <div class="dl" id="top5"></div>
      </div>
      <div class="card">
        <h2>제출한 점검 <span class="dim" style="font-size:13px;font-weight:500">(최근 순)</span></h2>
        <div class="list" id="hist"><p class="hint">불러오는 중…</p></div>
      </div>
      <div class="foot"><button class="btn ghost" id="btn-back2">처음으로</button></div>
    </section>

    <!-- 상세 -->
    <section class="screen" id="s-detail">
      <div class="card">
        <h2 id="dt-title">점검 상세</h2>
        <div id="dt-kv"></div>
        <div class="stats" id="dt-stats"></div>
      </div>
      <div id="dt-items"></div>
      <div class="foot"><button class="btn ghost" id="btn-back3">목록으로</button></div>
    </section>
  </main>
</div>

<script>
/* ────────────── 설정: Apps Script 웹앱 /exec URL ────────────── */
const API = window.MOMOS_API || 'https://script.google.com/macros/s/AKfycbyWN9kNtLHQbuUDJGKEIrD2CDjj83OPzBN7LApxlThY1idO3AQg9Fmtk9xyi2PlLC5J/exec';

const 결과라벨 = { 'O': ['이행', 'O'], '△': ['일부미흡', 'T'], 'X': ['미이행', 'X'], 'N/A': ['해당없음', 'N'] };
const 사유필수 = { '△': true, 'X': true };
const 주기설명 = { '일일': '매일 영업 전·후 점검', '주간': '주 1회 · 점장/팀장 점검', '월간': '월 1회 · 설비·교육·방제' };

const 상태 = {
  팀: ls('momos_team') || '바리스타', 매장: ls('momos_store') || '', 코드: ls('momos_code') || '', 담당자: ls('momos_name') || '',
  팀별매장: { '바리스타': ['본점', '영도', '마린시티', '도모헌'], '베이커리': ['본점', '마린시티'] },
  항목수: {}, 주기: '', 항목: [], 답: {}, 사유: {}, 시작: 0, 최근제출: null, 보기주기: '전체'
};
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ────────────── 통신 ────────────── */
function jsonp(action, data) {
  return new Promise((res, rej) => {
    const cb = 'cb_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const t = setTimeout(() => { cleanup(); rej(new Error('서버 응답이 없습니다 (시간 초과)')); }, 30000);
    function cleanup() { clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = r => { cleanup(); r && r.ok ? res(r) : rej(new Error((r && r.오류) || '요청 실패')); };
    s.onerror = () => { cleanup(); rej(new Error('서버에 연결할 수 없습니다 (배포 URL·접근 권한 확인)')); };
    s.src = API + '?action=' + encodeURIComponent(action) + '&callback=' + cb + '&data=' + encodeURIComponent(JSON.stringify(data || {})) + '&_=' + Date.now();
    document.head.appendChild(s);
  });
}
async function post(action, data) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify({ action, data }), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
  const j = await r.json();
  if (!j.ok) throw new Error(j.오류 || '요청 실패');
  return j;
}
const auth = () => ({ 매장: 상태.매장, 코드: 상태.코드, 팀: 상태.팀 });

/* ────────────── 화면 ────────────── */
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  window.scrollTo({ top: 0 });
  msg();
}
function msg(text, kind) {
  const m = $('#msg'); if (!text) { m.className = 'msg'; m.textContent = ''; return; }
  m.className = 'msg on ' + (kind || 'info'); m.textContent = text;
}
function head(t, s) { $('#h-title').textContent = t; $('#h-sub').textContent = s || ''; }
function busy(btn, on, label) { btn.disabled = on; if (on) { btn.dataset.l = btn.innerHTML; btn.innerHTML = '<span class="spin"></span> ' + (label || '처리 중…'); } else if (btn.dataset.l) btn.innerHTML = btn.dataset.l; }

/* ── 로그인 ── */
function renderTeams() {
  $('#teams').innerHTML = Object.keys(상태.팀별매장).map(t => `<button class="team ${t === 상태.팀 ? 'on' : ''}" data-t="${t}">${t}팀</button>`).join('');
  $('#teams').querySelectorAll('.team').forEach(b => b.onclick = () => { 상태.팀 = b.dataset.t; renderTeams(); renderStores(); });
}
function renderStores() {
  const list = 상태.팀별매장[상태.팀] || [];
  $('#store').innerHTML = list.map(s => `<option value="${s}" ${s === 상태.매장 ? 'selected' : ''}>${s}</option>`).join('');
}
async function login() {
  const btn = $('#btn-login');
  상태.매장 = $('#store').value; 상태.코드 = $('#code').value.trim(); 상태.담당자 = $('#name').value.trim();
  if (!상태.코드) return msg('매장 코드를 입력해 주세요', 'err');
  if (!상태.담당자) return msg('담당자 이름을 입력해 주세요', 'err');
  busy(btn, true, '확인 중…');
  try {
    const r = await jsonp('init', auth());
    상태.팀별매장 = r.팀별매장 || 상태.팀별매장; 상태.항목수 = r.항목수 || {};
    ls('momos_team', 상태.팀); ls('momos_store', 상태.매장); ls('momos_code', 상태.코드); ls('momos_name', 상태.담당자);
    home();
  } catch (e) { msg(e.message, 'err'); }
  busy(btn, false);
}
function home() {
  head(`${상태.매장} · ${상태.팀}팀`, '어떤 점검을 하시겠습니까?');
  $('#menu').innerHTML = ['일일', '주간', '월간'].map(z => `
    <button class="item" data-z="${z}">
      <div class="ico">${z[0]}</div>
      <div><div class="t">${z} 위생 점검</div><div class="desc">${주기설명[z]} · ${상태.항목수[z] ?? '-'}개 항목</div></div>
      <div class="arr">›</div>
    </button>`).join('');
  $('#menu').querySelectorAll('.item').forEach(b => b.onclick = () => startCheck(b.dataset.z));
  show('s-home');
}

/* ── 점검 ── */
async function startCheck(주기) {
  상태.주기 = 주기; 상태.답 = {}; 상태.사유 = {}; 상태.시작 = Date.now();
  head(`${상태.매장} · ${상태.팀}팀`, `${주기} 위생 점검`);
  $('#p-title').textContent = `${주기} 점검`; $('#p-done').textContent = 0; $('#p-total').textContent = 0; $('#p-bar').style.width = '0%';
  $('#date').value = today(); $('#name2').value = 상태.담당자; $('#note').value = '';
  $('#items').innerHTML = '<p class="hint">점검 항목을 불러오는 중…</p>';
  show('s-check');
  try {
    const r = await jsonp('load', { 팀: 상태.팀, 주기 });
    상태.항목 = r.항목 || [];
    renderItems();
  } catch (e) { $('#items').innerHTML = ''; msg(e.message, 'err'); }
}
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function renderItems() {
  const box = $('#items'); box.innerHTML = '';
  let sec = null;
  상태.항목.forEach(it => {
    if (it.섹션 !== sec) { sec = it.섹션; const h = document.createElement('div'); h.className = 'sec'; h.textContent = sec; box.appendChild(h); }
    const el = document.createElement('div'); el.className = 'it'; el.id = 'it-' + it.id;
    el.innerHTML = `
      <div class="head"><div class="id">${esc(it.id)}</div>
        <div class="txt">${esc(it.항목)}<span class="tag ${it.법적 ? 'law' : 'int'}">${it.법적 ? '법적처벌' : '내부기준'}</span>
          ${it.근거 ? `<div class="base">${esc(it.근거)}</div>` : ''}</div></div>
      <div class="seg">${Object.keys(결과라벨).map(v => `<button data-v="${v}">${v === 'N/A' ? 'N/A' : v}<small>${결과라벨[v][0]}</small></button>`).join('')}</div>
      <div class="why" id="why-${it.id}"><div class="lbl">사유 (필수) — 무엇이 어떻게 미흡했는지</div><textarea placeholder="예) 제빙기 내부 벽면 물때, 세척 필요"></textarea></div>`;
    el.querySelectorAll('.seg button').forEach(b => b.onclick = () => pick(it.id, b.dataset.v));
    el.querySelector('textarea').oninput = e => { 상태.사유[it.id] = e.target.value; el.classList.remove('need'); };
    box.appendChild(el);
  });
  $('#p-total').textContent = 상태.항목.length;
  progress();
}
function pick(id, v) {
  상태.답[id] = v;
  const el = $('#it-' + id);
  el.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  const why = $('#why-' + id); why.classList.toggle('on', !!사유필수[v]);
  el.classList.remove('need');
  if (사유필수[v] && !상태.사유[id]) setTimeout(() => why.querySelector('textarea').focus({ preventScroll: true }), 50);
  progress();
}
function progress() {
  const n = Object.keys(상태.답).length, t = 상태.항목.length;
  $('#p-done').textContent = n; $('#p-bar').style.width = (t ? n / t * 100 : 0) + '%';
}
async function submit() {
  const btn = $('#btn-submit');
  상태.담당자 = $('#name2').value.trim() || 상태.담당자; ls('momos_name', 상태.담당자);
  const missing = 상태.항목.filter(it => !상태.답[it.id]);
  const noWhy = 상태.항목.filter(it => 사유필수[상태.답[it.id]] && !(상태.사유[it.id] || '').trim());
  document.querySelectorAll('.it.need').forEach(e => e.classList.remove('need'));
  if (missing.length || noWhy.length) {
    [...missing, ...noWhy].forEach(it => $('#it-' + it.id).classList.add('need'));
    const first = $('#it-' + (missing[0] || noWhy[0]).id); first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return msg(missing.length ? `아직 선택하지 않은 항목이 ${missing.length}개 있습니다` : `일부미흡(△)·미이행(X) 항목 ${noWhy.length}개에 사유를 적어 주세요`, 'err');
  }
  busy(btn, true, '저장 중…');
  try {
    const r = await post('submit', { ...auth(), 주기: 상태.주기, 점검일: $('#date').value || today(), 담당자: 상태.담당자,
      소요: Math.round((Date.now() - 상태.시작) / 1000), 특이사항: $('#note').value.trim(),
      결과: 상태.항목.map(it => ({ id: it.id, 결과: 상태.답[it.id], 사유: (상태.사유[it.id] || '').trim() })) });
    상태.최근제출 = r;
    $('#done-meta').textContent = `${r.매장} · ${r.팀}팀 · ${r.주기} · ${r.점검일} · ${r.담당자}`;
    $('#done-score').textContent = r.점수 === null ? '-' : r.점수;
    $('#d-O').textContent = r.이행; $('#d-T').textContent = r.일부미흡; $('#d-X').textContent = r.미이행; $('#d-N').textContent = r.해당없음;
    head(`${상태.매장} · ${상태.팀}팀`, '제출 완료');
    show('s-done');
  } catch (e) { msg(e.message, 'err'); }
  busy(btn, false);
}

/* ── 대시보드 ── */
async function report() {
  head(`${상태.매장} · ${상태.팀}팀`, '점검 결과');
  $('#cycle-chips').innerHTML = ['전체', '일일', '주간', '월간'].map(z => `<button class="chip ${z === 상태.보기주기 ? 'on' : ''}" data-z="${z}">${z}</button>`).join('');
  $('#cycle-chips').querySelectorAll('.chip').forEach(b => b.onclick = () => { 상태.보기주기 = b.dataset.z; report(); });
  $('#hist').innerHTML = '<p class="hint">불러오는 중…</p>'; $('#chart').innerHTML = ''; $('#xlab').innerHTML = ''; $('#top5-card').style.display = 'none';
  show('s-report');
  try {
    const [h, t] = await Promise.all([jsonp('history', { ...auth(), 주기: 상태.보기주기, 건수: 40 }), jsonp('trend', { ...auth(), 주기: 상태.보기주기, 개월: 6 })]);
    renderTrend(t); renderHist(h);
  } catch (e) { $('#hist').innerHTML = ''; msg(e.message, 'err'); }
}
function renderTrend(t) {
  const rows = t.추이 || [];
  $('#chart').innerHTML = rows.map(r => {
    const v = r.점수; const h = v === null ? 0 : Math.max(4, v);
    return `<div class="col"><div class="v">${v === null ? '' : v}</div><div class="bx ${v === null ? 'empty' : ''}" style="height:${h}%"></div><div class="x">${r.미이행 ? 'X' + r.미이행 : ''}</div></div>`;
  }).join('');
  $('#xlab').innerHTML = rows.map(r => `<div>${r.월}<br><span class="dim">${r.횟수 ? r.횟수 + '회' : '-'}</span></div>`).join('');
  const top = t.자주미흡 || [];
  $('#top5-card').style.display = top.length ? '' : 'none';
  $('#top5').innerHTML = top.map(x => `<div class="d"><div class="r ${x.X ? 'X' : 'T'}">${esc(x.id)}</div><div class="n">${esc(x.항목)}</div><div class="cnt">X ${x.X} · △ ${x['△']}</div></div>`).join('');
}
function renderHist(h) {
  const list = h.목록 || [];
  if (!list.length) { $('#hist').innerHTML = '<p class="hint">아직 제출된 점검이 없습니다.</p>'; return; }
  $('#hist').innerHTML = list.map(r => `
    <button class="sub" data-id="${esc(r.제출번호)}">
      <div><div class="dt">${esc(r.점검일)} <span class="dim" style="font-weight:600">${esc(r.주기)}</span></div>
        <div class="meta">${esc(r.담당자)} · 제출 ${esc(r.제출시각)}${r.특이사항 ? ' · ' + esc(r.특이사항) : ''}</div></div>
      <div class="sc"><b>${r.점수 === null ? '-' : r.점수}</b>
        <div class="badges"><span class="b O">O ${r.이행}</span><span class="b T">△ ${r.일부미흡}</span><span class="b X">X ${r.미이행}</span>${r.해당없음 ? `<span class="b N">N/A ${r.해당없음}</span>` : ''}</div></div>
    </button>`).join('');
  $('#hist').querySelectorAll('.sub').forEach(b => b.onclick = () => detail(b.dataset.id));
}
async function detail(id) {
  head(`${상태.매장} · ${상태.팀}팀`, '점검 상세');
  $('#dt-kv').innerHTML = '<p class="hint">불러오는 중…</p>'; $('#dt-items').innerHTML = ''; $('#dt-stats').innerHTML = '';
  show('s-detail');
  try {
    const r = await jsonp('detail', { ...auth(), 제출번호: id });
    const s = r.요약;
    $('#dt-title').textContent = `${s.점검일} · ${s.주기} 점검`;
    $('#dt-kv').innerHTML = [['담당자', s.담당자], ['제출 시각', s.제출시각], ['점수', s.점수 === null ? '-' : s.점수 + '점'], ['소요', s.소요 ? s.소요 + '초' : '-'], ['특이사항', s.특이사항 || '-']]
      .map(([k, v]) => `<div class="kv"><span class="dim">${k}</span><b>${esc(v)}</b></div>`).join('');
    $('#dt-stats').innerHTML = `<div class="stat O"><b>${s.이행}</b><span>이행</span></div><div class="stat T"><b>${s.일부미흡}</b><span>일부미흡</span></div><div class="stat X"><b>${s.미이행}</b><span>미이행</span></div><div class="stat N"><b>${s.해당없음}</b><span>해당없음</span></div>`;
    const groups = [];
    (r.항목 || []).forEach(a => { let g = groups[groups.length - 1]; if (!g || g.섹션 !== a.섹션) { g = { 섹션: a.섹션, rows: [] }; groups.push(g); } g.rows.push(a); });
    $('#dt-items').innerHTML = groups.map(g => `<div class="sec">${esc(g.섹션)}</div><div class="dl">` + g.rows.map(a => {
      const L = 결과라벨[a.결과] || [a.결과, 'N'];
      return `<div class="d"><div class="r ${L[1]}">${esc(a.결과)}<br><span style="font-weight:600">${L[0]}</span></div>
        <div class="n">${esc(a.항목)}<small>${esc(a.id)}${a.법적 ? ' · 법적처벌' : ''}</small>${a.사유 ? `<span class="why2">↳ ${esc(a.사유)}</span>` : ''}</div></div>`;
    }).join('') + '</div>').join('') || '<p class="hint">항목 기록이 없습니다.</p>';
  } catch (e) { $('#dt-kv').innerHTML = ''; msg(e.message, 'err'); }
}

/* ── 초기화 ── */
function init() {
  if (/PASTE_YOUR_DEPLOYMENT_ID/.test(API)) { const s = $('#setup'); s.style.display = ''; s.textContent = '설정 필요: index.html 상단 const API 에 Apps Script 웹앱의 /exec URL을 넣어 주세요.'; }
  renderTeams(); renderStores();
  $('#code').value = 상태.코드; $('#name').value = 상태.담당자;
  $('#btn-login').onclick = login;
  $('#btn-logout').onclick = () => { head('매장 선택', '바리스타팀 · 베이커리팀 일일 / 주간 / 월간 위생 체크리스트'); renderTeams(); renderStores(); show('s-login'); };
  $('#btn-report').onclick = report;
  $('#btn-submit').onclick = submit;
  $('#btn-back1').onclick = () => { if (!Object.keys(상태.답).length || confirm('입력한 내용이 사라집니다. 뒤로 갈까요?')) home(); };
  $('#btn-done-home').onclick = home;
  $('#btn-done-detail').onclick = () => detail(상태.최근제출.제출번호);
  $('#btn-back2').onclick = home;
  $('#btn-back3').onclick = report;
  $('#code').addEventListener('keydown', e => { if (e.key === 'Enter') $('#name').focus(); });
  $('#name').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  // 저장된 로그인 정보가 있으면 자동 로그인 시도
  if (상태.매장 && 상태.코드 && 상태.담당자 && !/PASTE_YOUR_DEPLOYMENT_ID/.test(API)) {
    jsonp('init', auth()).then(r => { 상태.팀별매장 = r.팀별매장 || 상태.팀별매장; 상태.항목수 = r.항목수 || {}; home(); }).catch(() => {});
  }
}
init();
</script>
